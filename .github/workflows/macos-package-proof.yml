name: macOS package proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci
      - run: swift test --package-path apps/macos-menu-bar
      - run: npm run build:menubar

      - name: Validate and package ad-hoc build
        id: package
        shell: bash
        run: |
          set -euo pipefail

          app="dist/AI Usage Dashboard Menu Bar.app"
          plist="$app/Contents/Info.plist"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          asset="AI-Usage-Dashboard-Menu-Bar-${version}-adhoc.zip"

          plutil -lint "$plist"
          xattr -cr "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          /usr/bin/ditto --norsrc -c -k --keepParent "$app" "$RUNNER_TEMP/$asset"
          mkdir "$RUNNER_TEMP/macos-package-proof"
          /usr/bin/ditto -x -k "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/macos-package-proof"
          codesign --verify --deep --strict --verbose=2 \
            "$RUNNER_TEMP/macos-package-proof/AI Usage Dashboard Menu Bar.app"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 "$asset" > "$asset.sha256"
          )

          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload proof artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-menu-bar-adhoc
          path: |
            ${{ runner.temp }}/${{ steps.package.outputs.asset }}
            ${{ runner.temp }}/${{ steps.package.outputs.asset }}.sha256
          retention-days: 14
