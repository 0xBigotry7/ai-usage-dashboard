name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13.0", "24.x"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run audit:security
      - run: npm run check

  macos-menu-bar:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci
      - run: npm run audit:security
      - run: npm test
      - run: swift test --package-path apps/macos-menu-bar
      - name: Check compact menu presentation
        run: |
          swiftc apps/macos-menu-bar/Sources/UsageMenuBar/MenuPresentation.swift \
            apps/macos-menu-bar/Sources/UsageMenuBar/DemoData.swift \
            tests/menu-presentation-check.swift -o "$RUNNER_TEMP/menu-presentation-check"
          "$RUNNER_TEMP/menu-presentation-check"
      - run: npm run build:menubar
